<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Nullstellen quadratischer Polynome</title>
    <script src="script.js"></script>
</head>
<body>
<h1>Nullstellen quadratischer Polynome</h1>
<p>Dieses Programm berechnet die Nullstellen quadratischer Polynome der Form: <b><i>ax²+bx+c</i></b> und stellt die Lösung im Interval x ∈ [-10; 10] grafisch dar.</p>
<p>Bitte geben Sie die gewünschten Werte zur Berechnung ein:</p>

<div class="inputs">
    <div>
        <label for="input_a">a:</label>
        <input id="input_a" name="a" type="number" step="any"> <br>
    </div>
    <div>
        <label for="input_b">b:</label>
        <input id="input_b" name="b" type="number" step="any"> <br>
    </div>
    <div>
        <label for="input_c">c:</label>
        <input id="input_c" name="c" type="number" step="any"> <br>
    </div>
</div>


<div class="calculate_button">
    <br>
    <button type="button" onclick="nullstellenBerechnen(
        document.getElementById('input_a').valueAsNumber,
        document.getElementById('input_b').valueAsNumber,
        document.getElementById('input_c').valueAsNumber
    )">Nullstellen berechnen</button>
</div>

<div id="result"></div>

</body>
</html>
